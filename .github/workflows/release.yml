name: Build and release

# Every pull request and push to main: on Windows the tests, the release
# files, the installer over a C# installation and a real unattended update
# from this version to the next; on macOS the tests and the apps for Apple
# silicon and Intel, started once. A tag v<version> does the same and then
# publishes the GitHub release with all of them, and the manifest.json the
# installed versions read (releases/latest/download/manifest.json).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: version
        run: |
          $v = (Select-String -Path app/internal/version/version.go -Pattern 'Version = "([0-9.]+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $v) { throw "tag v$tag does not match the program's version $v (app/internal/version)" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version $v"

      - name: Go vet (Windows)
        working-directory: app
        run: go vet ./...

      - name: Go tests (Windows)
        working-directory: app
        run: go test ./... -count=1

      - name: Release tool tests
        working-directory: tools
        run: python test_release_go.py

      - name: Inno Setup
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Release files
        run: |
          $PSNativeCommandUseErrorActionPreference = $true # a failed command fails the step
          python tools/release_go.py release --version ${{ steps.version.outputs.version }} --notes-file docs/release-notes/v${{ steps.version.outputs.version }}.md
          Get-ChildItem artifacts/release | Format-Table Name, Length

      - name: Installer over a C# installation, then an unattended update to the next version
        run: python tools/e2e_update.py --version ${{ steps.version.outputs.version }} --installer artifacts/release/Klip-${{ steps.version.outputs.version }}-setup.exe --work "${{ runner.temp }}/e2e"

      - uses: actions/upload-artifact@v4
        with:
          name: Klip-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/release/
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Version
        id: version
        run: |
          v=$(sed -n 's/.*Version = "\([0-9.]*\)".*/\1/p' app/internal/version/version.go)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Go vet (macOS)
        working-directory: app
        run: go vet ./...

      - name: Go tests (macOS)
        working-directory: app
        run: go test ./... -count=1

      - name: Apps for Apple silicon and Intel
        run: |
          bash tools/package_mac.sh ${{ steps.version.outputs.version }} arm64 artifacts/mac
          bash tools/package_mac.sh ${{ steps.version.outputs.version }} amd64 artifacts/mac

      - name: Start the app once
        run: |
          # A home of its own: the app's data and settings go there.
          home="$RUNNER_TEMP/klip-home"; mkdir -p "$home"
          app="artifacts/mac/Klip-${{ steps.version.outputs.version }}-mac-$( [ "$(uname -m)" = arm64 ] && echo arm64 || echo x64 )/Klip.app/Contents/MacOS/Klip"
          HOME="$home" "$app" > "$RUNNER_TEMP/klip.log" 2>&1 &
          pid=$!
          sleep 20
          alive=0; kill -0 "$pid" 2>/dev/null && alive=1
          kill "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/klip.log"
          [ "$alive" = 1 ] || { echo "the app did not keep running"; exit 1; }
          [ -f "$home/Library/Application Support/Klip/history.json" ] || { echo "the app wrote no history"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Klip-${{ steps.version.outputs.version }}-mac
          path: artifacts/mac/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Manifest with every system's package
        run: |
          v="${{ needs.windows.outputs.version }}"
          rm -f release/manifest.json
          python tools/release_go.py manifest --version "$v" --dir release --notes-file "docs/release-notes/v$v.md"
          ls -l release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.windows.outputs.version }}"
          # All files in one call: the release is published only once they are
          # all there, so "latest" never points at a release without its manifest.
          gh release create "v$v" --verify-tag --title "Klip $v" --notes-file "docs/release-notes/v$v.md" \
            "release/Klip-$v-setup.exe" "release/Klip-$v-win-x64.zip" \
            "release/Klip-$v-mac-arm64.zip" "release/Klip-$v-mac-x64.zip" "release/manifest.json"
